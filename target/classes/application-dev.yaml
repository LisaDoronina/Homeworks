spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8081

app:
  name: To-Do List Manager (DEV)
  version: 1.0.0-DEV
  environment: development

logging:
  level:
    com.example.todolist: DEBUG
    org.springframework.web: DEBUG
    org.springframework.aop: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"