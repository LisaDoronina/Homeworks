spring:
  application:
    name: todo-list-manager
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  name: To-Do List Manager
  version: 1.0.0
  description: MVP приложение для управления задачами
  developer: Student Name
  environment: ${APP_ENV:default}

logging:
  level:
    com.example.todolist: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans

api:
  version: "2.0.0"