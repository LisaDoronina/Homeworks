spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: 8080

logging:
  level:
    com.example.todolist: DEBUG
    org.springframework.web: DEBUG

app:
  name: todo list manager
  description: Task management system for tracking and organizing tasks
  developer: Lisa Doronina
  version: 2.0.0
  api-version: 2.0.0
  api:
    version: 2.0.0
  attachments:
    upload-dir: uploads

spring.flyway:
  enabled: true
  locations: classpath:db/migration