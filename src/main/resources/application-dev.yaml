spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/todolist_dev
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    com.example.todolist: DEBUG
    org.springframework.web: DEBUG
    org.springframework.aop: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  name: todo list manager
  description: Task management system - Development mode
  developer: Lisa Doronina
  version: 2.0.0
  api-version: 2.0.0
  api:
    version: 2.0.0
  attachments:
    upload-dir: uploads